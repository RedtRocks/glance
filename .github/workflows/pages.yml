name: Website

# Publishes the landing page (site/) and the browser version of Glance (at /app/)
# to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/decoder
          key: wasm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Build the browser version
        run: node scripts/build-web.mjs
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/app
          cp -r dist-web/. _site/app/
      # Visitor statistics (Umami, https://cloud.umami.is). The website ID is public
      # (it is in every page); the repository variable UMAMI_WEBSITE_ID overrides it.
      - name: Add visitor statistics
        env:
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID || 'a1808523-2061-4907-9172-7dedd5e60b7f' }}
        run: node scripts/add-analytics.mjs _site "$UMAMI_WEBSITE_ID"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Asks Bing and the other IndexNow engines to recrawl the pages this push
      # changed. A failure here never fails the deploy.
      - name: Tell search engines what changed (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs "${{ github.event.before }}"

