name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Changes that only touch docs (Markdown, README images under assets/, the landing page
  # under site/) can't break the app, so the build and test jobs below skip for them. A
  # skipped job counts as passed, so pull requests stay mergeable. Running CI by hand
  # always runs everything.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!assets/**'
              - '!site/**'
              - '!LICENSE'

  frontend:
    name: Frontend (typecheck, tests, build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  web:
    name: Web version (WebAssembly decoders, offline build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/decoder
          key: wasm
      - run: npm ci
      - run: node scripts/build-web.mjs
      - name: Check the offline build is complete
        run: |
          test -f dist-web/decoder.wasm
          test -f dist-web/web/manifest.webmanifest
          grep -q "const CORE = \[" dist-web/sw.js

  windows:
    name: Windows (Rust tests incl. WIC, NSIS installer)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/thumbnailer
            src-tauri/mcp-bridge
            src-tauri/context-menu
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: PDF thumbnailer tests
        working-directory: src-tauri/thumbnailer
        run: cargo test --locked
      - name: glance-mcp tests
        working-directory: src-tauri/mcp-bridge
        run: cargo test --locked
      - name: Build installer
        run: npx tauri build --bundles nsis
      - name: Check Default apps registration (install, then uninstall)
        timeout-minutes: 20
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $caps = Get-ItemPropertyValue 'HKCU:\Software\RegisteredApplications' -Name Glance
          if ($caps -ne 'Software\Glance\Capabilities') { throw "RegisteredApplications\Glance is '$caps'" }
          foreach ($ext in '.pdf', '.jpg', '.heic', '.cr2', '.glb') {
            $progId = Get-ItemPropertyValue 'HKCU:\Software\Glance\Capabilities\FileAssociations' -Name $ext
            $cmd = Get-ItemPropertyValue "HKCU:\Software\Classes\$progId\shell\open\command" -Name '(default)'
            if ($cmd -notlike '*glance.exe" "%1"') { throw "$ext -> $progId runs '$cmd'" }
            Get-ItemPropertyValue "HKCU:\Software\Classes\$ext\OpenWithProgids" -Name $progId | Out-Null
          }
          # Tauri's per-user .jpg key hides the system's PerceivedType; without it photos lose their thumbnails.
          $perceived = Get-ItemPropertyValue 'Registry::HKEY_CLASSES_ROOT\.jpg' -Name PerceivedType
          if ($perceived -ne 'image') { throw ".jpg PerceivedType is '$perceived'" }
          # Explorer gets a PDF's first page from Glance's thumbnailer, through the shell's own lookup.
          reg query 'HKCR\.pdf' /s
          reg query 'HKCR\SystemFileAssociations\.pdf' /s 2>$null
          reg query 'HKCR\.tga' /s
          # Explorer gets thumbnails from Glance's handler, through the shell's own lookup. That
          # lookup activates the handler in a surrogate process, and COM ignores per-user classes
          # for elevated callers; CI can only run elevated, so the check mirrors the classes into
          # HKLM for its duration. Normal (non-elevated) users get the per-user classes as installed.
          $classes = '{4d578e19-3f31-49d8-8d05-706466000000}', '{4d578e19-3f31-49d8-8d05-746761000000}'
          foreach ($c in $classes) { reg copy "HKCU\Software\Classes\CLSID\$c" "HKLM\Software\Classes\CLSID\$c" /s /f /reg:64 | Out-Null }
          Push-Location src-tauri/thumbnailer
          cargo test --locked -- --ignored installed_handler
          $failed = $LASTEXITCODE
          foreach ($c in $classes) { reg delete "HKLM\Software\Classes\CLSID\$c" /f /reg:64 | Out-Null }
          if ($failed -ne 0) { throw 'no thumbnail from the installed handler' }
          Pop-Location
          # AI apps: glance-mcp starts the installed Glance in the background, and its tools
          # work end to end. Glance quits a few seconds after the AI app disconnects.
          node scripts/mcp-smoke.mjs (Join-Path $env:LOCALAPPDATA 'Glance\glance-mcp.exe')
          if ($LASTEXITCODE -ne 0) { throw 'AI tools smoke test failed' }
          Start-Sleep -Seconds 6
          if (Get-Process glance -ErrorAction SilentlyContinue) { throw 'Glance kept running after the AI app disconnected' }
          # The live tools open the window, so Glance stays open after this run.
          node scripts/mcp-smoke.mjs (Join-Path $env:LOCALAPPDATA 'Glance\glance-mcp.exe') --live
          if ($LASTEXITCODE -ne 0) { throw 'AI live tools smoke test failed' }
          Stop-Process -Name glance -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $dir = Join-Path $env:LOCALAPPDATA Glance
          Start-Process (Join-Path $dir uninstall.exe) -ArgumentList '/S', "_?=$dir" -Wait
          if (Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -Name Glance -ErrorAction SilentlyContinue) { throw 'still registered after uninstall' }
          if (Test-Path 'HKCU:\Software\Glance\Capabilities') { throw 'Capabilities left after uninstall' }
          if (Test-Path 'HKCU:\Software\Classes\CLSID\{4d578e19-3f31-49d8-8d05-706466000000}') { throw 'thumbnailer left after uninstall' }
          if (Test-Path (Join-Path $dir 'glance-mcp.exe')) { throw 'glance-mcp.exe left after uninstall' }
      - uses: actions/upload-artifact@v4
        with:
          name: glance-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Build context menu (Store package)
        working-directory: src-tauri/context-menu
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Pack MSIX (Store package, test identity)
        shell: pwsh
        run: packaging/msix/pack.ps1 -Exe src-tauri/target/release/glance.exe -ContextMenu src-tauri/context-menu/target/release/glance_context_menu.dll -Arch x64 -Out msix/Glance-x64.msix
      - uses: actions/upload-artifact@v4
        with:
          name: glance-windows-x64-msix
          path: msix/*.msix
          if-no-files-found: error
      - name: Check the Store package (install, then AI apps through its glance-mcp alias)
        timeout-minutes: 15
        shell: pwsh
        run: |
          # The Store signs what it publishes. Here a throwaway certificate for the test identity
          # (DEV_IDENTITY in scripts/packaging.ts) lets Windows install a signed copy.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Glance Dev' -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'glance-ci.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'glance-ci.cer'
          $secret = [guid]::NewGuid().ToString()
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $secret -Force -AsPlainText) | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $msix = Join-Path $env:RUNNER_TEMP 'Glance-x64.msix'
          Copy-Item msix/Glance-x64.msix $msix
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $secret $msix
          if ($LASTEXITCODE -ne 0) { throw 'signing the test package failed' }
          Add-AppxPackage -Path $msix
          # Partner Center refuses apps that aren't listed in Start (AppListEntry="none").
          $pkg = Get-AppxPackage -Name Glance.Dev
          $apps = @((Get-AppxPackageManifest $pkg).Package.Applications.Application)
          if ($apps.Count -ne 1) { throw "the package has $($apps.Count) applications" }
          # AI apps run the alias, which starts Glance.exe as glance-mcp (src-tauri/src/main.rs).
          $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\glance-mcp.exe'
          node scripts/mcp-smoke.mjs $alias
          if ($LASTEXITCODE -ne 0) { throw 'AI tools smoke test through the Store package failed' }
          Start-Sleep -Seconds 6
          if (Get-Process glance -ErrorAction SilentlyContinue) { throw 'Glance kept running after the AI app disconnected' }
          # Windows 11's right-click menu: each command comes from the package's COM classes, as
          # Explorer creates them, and Combine into PDF starts the packaged Glance with the file.
          Push-Location src-tauri/context-menu
          cargo test --locked -- --ignored installed_package
          $failed = $LASTEXITCODE
          Pop-Location
          if ($failed -ne 0) { throw 'the context menu commands failed' }
          $launched = $null
          foreach ($i in 1..20) {
            $launched = Get-CimInstance Win32_Process -Filter "Name = 'Glance.exe'" | Where-Object { $_.CommandLine -like '*--combine-pdf*scan.pdf*' }
            if ($launched) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $launched) { throw 'Combine into PDF did not start Glance' }
          if ($launched.ExecutablePath -notlike '*\WindowsApps\*') { throw "Combine into PDF started $($launched.ExecutablePath)" }
          Stop-Process -Name glance -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Remove-AppxPackage -Package $pkg.PackageFullName

  windows-arm64:
    name: Windows ARM64 (build check)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: arm64
      - name: Frontend placeholder
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Check (runs build scripts, e.g. tract's ARM64 kernels via clang)
        working-directory: src-tauri
        run: cargo check --locked --target aarch64-pc-windows-msvc
      - name: Check PDF thumbnailer
        working-directory: src-tauri/thumbnailer
        run: cargo check --locked --target aarch64-pc-windows-msvc
      - name: Check glance-mcp
        working-directory: src-tauri/mcp-bridge
        run: cargo check --locked --target aarch64-pc-windows-msvc
      - name: Check context menu
        working-directory: src-tauri/context-menu
        run: cargo check --locked --target aarch64-pc-windows-msvc

  linux-rust:
    name: Rust tests (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        working-directory: src-tauri
        run: |
          mkdir -p ../dist && [ -f ../dist/index.html ] || echo '<!doctype html>' > ../dist/index.html
          cargo test --locked
      - name: glance-mcp tests
        working-directory: src-tauri/mcp-bridge
        run: cargo test --locked

  linux-rpm:
    name: Linux RPM (Fedora, AI tools smoke test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:42
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git gcc gcc-c++ clang make perl file rpm-build webkit2gtk4.1-devel openssl-devel \
            librsvg2-devel libxdo-devel nodejs npm xorg-x11-server-Xvfb dbus-daemon cpio
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/mcp-bridge
          key: fedora
      - run: npm ci
      - name: Build RPM
        run: npx tauri build --bundles rpm
      - name: Check the RPM contents
        run: |
          rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm | head -n1)
          rpm -qlp "$rpm" | tee files.txt
          grep -qx /usr/bin/glance files.txt
          grep -qx /usr/bin/glance-mcp files.txt
          mkdir rpm-root && (cd rpm-root && rpm2cpio "../$rpm" | cpio -idm --quiet)
          desktop=$(find rpm-root/usr/share/applications -name '*.desktop' | head -n1)
          cat "$desktop"
          grep -q '^Exec=.* %F$' "$desktop"
          grep -q 'image/heic' "$desktop"
      - name: Install RPM
        run: dnf install -y ./src-tauri/target/release/bundle/rpm/*.rpm
      - name: AI tools smoke test (installed glance-mcp)
        timeout-minutes: 15
        run: |
          # Containers have no login session, so give Glance a private runtime dir and a session bus.
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          dbus-run-session -- xvfb-run -a node scripts/mcp-smoke.mjs /usr/bin/glance-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: glance-linux-x86_64-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
