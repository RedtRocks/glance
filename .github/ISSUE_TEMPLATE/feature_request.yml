name: Feature request
description: Suggest something Glance should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. If macOS Preview or another app does it, say how.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
