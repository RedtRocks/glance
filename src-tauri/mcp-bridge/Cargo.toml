[package]
name = "glance-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Lets AI apps use Glance: an MCP stdio server that relays to the Glance app (see src/lib.rs)"
publish = false

[lib]
name = "glance_mcp"
path = "src/lib.rs"

[[bin]]
name = "glance-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
