name: Microsoft Store package

# Builds the MSIX bundle to upload in Partner Center (packaging/README.md). The Release
# workflow runs this after publishing (skipped quietly until the MSIX_* identity is set);
# it can also be run from the Actions tab for the selected branch. The identity can be
# repository variables or secrets.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      optional:
        description: Skip instead of failing when the Store identity isn't set
        type: boolean
        default: false

permissions:
  contents: read

env:
  MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || secrets.MSIX_IDENTITY_NAME }}
  MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || secrets.MSIX_PUBLISHER }}
  MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
  # Optional: overrides the reserved app name in scripts/packaging.ts (STORE_DISPLAY_NAME).
  MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME || secrets.MSIX_DISPLAY_NAME }}

jobs:
  identity:
    name: Check Store identity
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: bash
        env:
          OPTIONAL: ${{ inputs.optional }}
        run: |
          if [ -n "$MSIX_IDENTITY_NAME" ] && [ -n "$MSIX_PUBLISHER" ] && [ -n "$MSIX_PUBLISHER_DISPLAY_NAME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$OPTIONAL" = "true" ]; then
            echo "::notice::No Store identity set, so no Store package was built. See packaging/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME as repository variables or secrets (Partner Center > Product identity). See packaging/README.md."
            exit 1
          fi

  build:
    name: MSIX ${{ matrix.arch }}
    needs: identity
    if: needs.identity.outputs.ready == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/context-menu
          key: release-${{ matrix.target }}
      - run: npm ci
      - name: Build Glance
        run: npx tauri build --target ${{ matrix.target }} --no-bundle
      - name: Build context menu
        working-directory: src-tauri/context-menu
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack MSIX
        shell: pwsh
        run: packaging/msix/pack.ps1 -Exe src-tauri/target/${{ matrix.target }}/release/glance.exe -ContextMenu src-tauri/context-menu/target/${{ matrix.target }}/release/glance_context_menu.dll -Arch ${{ matrix.arch }} -Out msix/Glance-${{ matrix.arch }}.msix
      - uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.arch }}
          path: msix/*.msix
          if-no-files-found: error

  bundle:
    name: MSIX bundle
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: msix-*
          path: msix
          merge-multiple: true
      - name: Bundle
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          packaging/msix/pack.ps1 -BundleFrom msix -Out "store/Glance-$version.msixbundle"
          "VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Glance-${{ env.VERSION }}-store
          path: store/*.msixbundle
          if-no-files-found: error
