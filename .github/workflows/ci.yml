name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Changes that only touch docs (Markdown, README images under assets/, the landing page
  # under site/) can't break the app, so the build and test jobs below skip for them. A
  # skipped job counts as passed, so pull requests stay mergeable. Running CI by hand
  # always runs everything.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!assets/**'
              - '!site/**'
              - '!LICENSE'

  frontend:
    name: Frontend (typecheck, tests, build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  windows:
    name: Windows (Rust tests incl. WIC, NSIS installer)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/thumbnailer
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: PDF thumbnailer tests
        working-directory: src-tauri/thumbnailer
        run: cargo test --locked
      - name: Build installer
        run: npx tauri build --bundles nsis
      - name: Check Default apps registration (install, then uninstall)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $caps = Get-ItemPropertyValue 'HKCU:\Software\RegisteredApplications' -Name Glance
          if ($caps -ne 'Software\Glance\Capabilities') { throw "RegisteredApplications\Glance is '$caps'" }
          foreach ($ext in '.pdf', '.jpg', '.heic', '.cr2', '.glb') {
            $progId = Get-ItemPropertyValue 'HKCU:\Software\Glance\Capabilities\FileAssociations' -Name $ext
            $cmd = Get-ItemPropertyValue "HKCU:\Software\Classes\$progId\shell\open\command" -Name '(default)'
            if ($cmd -notlike '*glance.exe" "%1"') { throw "$ext -> $progId runs '$cmd'" }
            Get-ItemPropertyValue "HKCU:\Software\Classes\$ext\OpenWithProgids" -Name $progId | Out-Null
          }
          # Tauri's per-user .jpg key hides the system's PerceivedType; without it photos lose their thumbnails.
          $perceived = Get-ItemPropertyValue 'Registry::HKEY_CLASSES_ROOT\.jpg' -Name PerceivedType
          if ($perceived -ne 'image') { throw ".jpg PerceivedType is '$perceived'" }
          # Explorer gets a PDF's first page from Glance's thumbnailer, through the shell's own lookup.
          reg query 'HKCR\.pdf' /s
          reg query 'HKCR\SystemFileAssociations\.pdf' /s 2>$null
          reg query 'HKCR\.tga' /s
          # Explorer gets thumbnails from Glance's handler, through the shell's own lookup. That
          # lookup activates the handler in a surrogate process, and COM ignores per-user classes
          # for elevated callers; CI can only run elevated, so the check mirrors the classes into
          # HKLM for its duration. Normal (non-elevated) users get the per-user classes as installed.
          $classes = '{4d578e19-3f31-49d8-8d05-706466000000}', '{4d578e19-3f31-49d8-8d05-746761000000}'
          foreach ($c in $classes) { reg copy "HKCU\Software\Classes\CLSID\$c" "HKLM\Software\Classes\CLSID\$c" /s /f /reg:64 | Out-Null }
          Push-Location src-tauri/thumbnailer
          cargo test --locked -- --ignored installed_handler
          $failed = $LASTEXITCODE
          foreach ($c in $classes) { reg delete "HKLM\Software\Classes\CLSID\$c" /f /reg:64 | Out-Null }
          if ($failed -ne 0) { throw 'no thumbnail from the installed handler' }
          Pop-Location
          $dir = Join-Path $env:LOCALAPPDATA Glance
          Start-Process (Join-Path $dir uninstall.exe) -ArgumentList '/S', "_?=$dir" -Wait
          if (Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -Name Glance -ErrorAction SilentlyContinue) { throw 'still registered after uninstall' }
          if (Test-Path 'HKCU:\Software\Glance\Capabilities') { throw 'Capabilities left after uninstall' }
          if (Test-Path 'HKCU:\Software\Classes\CLSID\{4d578e19-3f31-49d8-8d05-706466000000}') { throw 'thumbnailer left after uninstall' }
      - uses: actions/upload-artifact@v4
        with:
          name: glance-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Pack MSIX (Store package, test identity)
        shell: pwsh
        run: packaging/msix/pack.ps1 -Exe src-tauri/target/release/glance.exe -Arch x64 -Out msix/Glance-x64.msix
      - uses: actions/upload-artifact@v4
        with:
          name: glance-windows-x64-msix
          path: msix/*.msix
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 (build check)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: arm64
      - name: Frontend placeholder
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Check (runs build scripts, e.g. tract's ARM64 kernels via clang)
        working-directory: src-tauri
        run: cargo check --locked --target aarch64-pc-windows-msvc
      - name: Check PDF thumbnailer
        working-directory: src-tauri/thumbnailer
        run: cargo check --locked --target aarch64-pc-windows-msvc

  linux-rust:
    name: Rust tests (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        working-directory: src-tauri
        run: |
          mkdir -p ../dist && [ -f ../dist/index.html ] || echo '<!doctype html>' > ../dist/index.html
          cargo test --locked
