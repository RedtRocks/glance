[package]
name = "glance-thumbnailer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Explorer thumbnail handler for the formats Windows can't preview (see src/lib.rs)"
publish = false

[lib]
name = "glance_thumbnailer"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
# Same decoders as the app (src-tauri/src/decode, included by path).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "tga", "exr", "hdr", "dds", "pnm", "qoi"] }
icns = "0.5"
jxl-oxide = { version = "0.12", features = ["image"] }
hayro-jpeg2000 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
which = "7"
windows = { version = "0.62", features = [
  "Data_Pdf",
  "Foundation",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Variant",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
] }
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
